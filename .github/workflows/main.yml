name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MVP ESPORTS LIVE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Verify project structure
        working-directory: mvp-esports-live
        run: |
          echo "=== Project files ==="
          pwd
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml
          echo "=== Gradle version ==="
          gradle --version
          echo "=== KSP/Kotlin configuration ==="
          grep -E '^(kotlin|googleDevtoolsKsp)[[:space:]]*=' gradle/libs.versions.toml

      - name: Create required debug keystore
        working-directory: mvp-esports-live
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore

      - name: Clean
        working-directory: mvp-esports-live
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: mvp-esports-live
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Verify APK
        working-directory: mvp-esports-live
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs -type f -maxdepth 6 2>/dev/null || true
            exit 1
          fi

          echo "===================================="
          echo "MVP ESPORTS LIVE APK BUILD SUCCESS"
          echo "===================================="
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MVP-ESPORTS-LIVE-debug
          path: mvp-esports-live/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
