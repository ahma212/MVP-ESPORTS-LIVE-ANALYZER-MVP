MVP ESPORTS LIVE
MASTER ANDROID APP BUILD WORKFLOW
==================================

PROJECT GOAL
------------
Build the MVP ESPORTS LIVE Android application from the existing
GitHub repository.

PRIMARY RULE:
GitHub main branch is the source of truth.

FINAL RESULT:
A real, buildable, installable Android application that works on
a physical Android device.

