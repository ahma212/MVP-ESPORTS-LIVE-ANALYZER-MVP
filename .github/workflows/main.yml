RULES
 |
 +--> No guessed file contents
 +--> No guessed line numbers
 +--> No duplicate functions
 +--> No duplicate classes
 +--> No dead references
 +--> No mock implementation
 +--> No unnecessary rewrite
 +--> No hidden fallback
 +--> No broken lifecycle connection


